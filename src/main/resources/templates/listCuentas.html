<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Lista de Cuentas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }

        h1 {
            color: #2e6da4;
        }

        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
            font-size: 16px;
        }

        th {
            background-color: #f2f2f2;
            color: #333;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        p {
            font-size: 16px;
            color: red;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px;
            background-color: #5cb85c;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        a:hover {
            background-color: #4cae4c;
        }
    </style>
</head>
<body>
<h1>Lista de Cuentas</h1>

<p th:if="${#lists.isEmpty(cuentas)}">No hay cuentas registradas.</p>

<table th:if="${not #lists.isEmpty(cuentas)}">
    <thead>
    <tr>
        <th>Número de Cuenta</th>
        <th>Sucursal</th>
        <th>ID Usuario</th>
        <th>Balance (€)</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="cuenta : ${cuentas}">
        <td th:text="${cuenta.getNumeroCuenta()}"></td>
        <td th:text="${cuenta.getSucursal()}"></td>
        <td th:text="${cuenta.getIdUsuario()}"></td>
        <td th:text="${cuenta.getBalance()}"></td>
    </tr>
    </tbody>
</table>

<br>
<a href="/">Volver al menú principal</a>
</body>
</html>
