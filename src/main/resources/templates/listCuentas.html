<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de cuentas</title>
    <style>
        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }

        th {
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Lista de cuentas</h1>

    <table>
        <thead>
            <tr>
                <th>Numero de cuenta</th>
                <th>Sucursal</th>
                <th>ID usuario</th>
                <th>Balance</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="cuenta : ${cuentas}">
                <td th:text="${cuenta.numeroCuenta}">Numero de cuenta</td>
                <td th:text="${cuenta.sucursal}">Sucursal</td>
                <td th:text="${cuenta.idUsuario}">ID usuario</td>
                <td th:text="${cuenta.balance}">Balance</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
