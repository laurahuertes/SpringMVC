<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Menú Principal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }

        h1 {
            color: #2e6da4;
        }

        .menu {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
        }

        .menu div {
            background-color: #f2f2f2;
            padding: 20px;
            border-radius: 10px;
            width: 25%;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .menu div h2 {
            color: #333;
        }

        .menu div a {
            display: block;
            margin-top: 10px;
            padding: 10px;
            background-color: #5cb85c;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .menu div a:hover {
            background-color: #4cae4c;
        }

        .menu div a.delete:hover {
            background-color: #c9302c;
        }

        .menu div form {
            margin-top: 10px;
        }

        .menu div form input[type="submit"] {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #5cb85c;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            text-align: center;
        }

        .menu div form input[type="submit"]:hover {
            background-color: #4cae4c;
        }
    </style>
</head>
<body>
    <h1>Menú Principal</h1>

    <div class="menu">
        <!-- Menú Clientes -->
        <div>
            <h2>Clientes</h2>
            <a href="/clientes/addCliente" class="add">Añadir Cliente</a>
            <a href="/clientes/eliminar" class="delete">Eliminar Cliente</a>
        </div>

        <!-- Menú Cuentas -->
        <div>
            <h2>Cuentas</h2>
            <form action="/cuentas/addCuenta" method="get">
                <input type="submit" value="Añadir cuenta">
            </form>

            <form action="/cuentas/deleteCuenta" method="get">
                <input type="submit" value="Eliminar cuenta">
            </form>

            <form action="/cuentas/detailCuenta" method="get">
                <input type="submit" value="Mostrar balance de una cuenta">
            </form>

            <form action="/cuentas/listCuentas" method="get">
                <input type="submit" value="Listar cuentas">
            </form>
        </div>

        <!-- Menú Sucursales -->
        <div>
            <h2>Sucursales</h2>
            <a href="/sucursales/formularioAddSucursal" class="add">Añadir sucursal</a>
            <a href="/sucursales/listadoSucursales" class="get">Listar sucursales</a>
            <a href="/sucursales/formularioDeleteSucursal" class="delete">Eliminar sucursal</a>
            <a href="/sucursales/formularioModifySucursal" class="modify">Modificar sucursal</a>
        </div>
    </div>
</body>
</html>
