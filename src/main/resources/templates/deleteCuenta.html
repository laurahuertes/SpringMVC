<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Cuenta</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }

        h1 {
            color: #2e6da4;
        }

        div {
            background-color: #f2f2f2;
            padding: 20px;
            border-radius: 10px;
            width: 40%;
            margin: 0 auto;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        div h2 {
            color: #333;
        }

        div a {
            display: block;
            margin-top: 10px;
            padding: 10px;
            background-color: #5cb85c;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        div a:hover {
            background-color: #4cae4c;
        }

        div a.delete {
            background-color: #d9534f;
        }

        div a.delete:hover {
            background-color: #c9302c;
        }

        div form {
            margin-top: 20px;
        }

        div form input[type="number"] {
            padding: 10px;
            width: 80%;
            margin-top: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        div form input[type="submit"] {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #d9534f;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            text-align: center;
            margin-top: 15px;
        }

        div form input[type="submit"]:hover {
            background-color: #c9302c;
        }

        .message {
            margin-top: 20px;
            color: red;
            font-weight: bold;
        }

        a.volver {
            display: inline-block;
            margin-top: 20px;
            padding: 10px;
            background-color: #5cb85c;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        a.volver:hover {
            background-color: #4cae4c;
        }
    </style>
</head>
<body>
<h1>Eliminar Cuenta</h1>

<div>
    <form action="/cuentas/deleteCuenta" method="post">
        <label for="numeroCuenta">Número de Cuenta:</label>
        <input type="number" id="numeroCuenta" name="numeroCuenta" required>

        <input type="submit" value="Eliminar Cuenta">
    </form>

    <div th:if="${message}" class="message">
        <p th:text="${message}"></p>
    </div>

    <a href="/" class="volver">Volver al menú principal</a>
</div>
</body>
</html>
