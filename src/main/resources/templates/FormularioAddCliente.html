<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Cliente</title>
</head>
<body>
<h1>Agregar Cliente</h1>

<!-- Formulario para agregar un nuevo cliente -->
<form action="/clientes/addCliente" method="POST">
    <label for="dni">DNI:</label>
    <input type="text" id="dni" name="dni" required><br><br>

    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" required><br><br>

    <label for="direccion">Dirección:</label>
    <input type="text" id="direccion" name="direccion" required><br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required><br><br>

    <label for="telefono">Teléfono:</label>
    <input type="text" id="telefono" name="telefono" required><br><br>

    <label for="sucursalPrincipal">Sucursal Principal:</label>
    <input type="number" id="sucursalPrincipal" name="sucursalPrincipal" required><br><br>

    <button type="submit">Agregar Cliente</button>
</form>

<br>
<a href="/clientes/listadoClientes">Ver Listado de Clientes</a>
</body>
</html>
