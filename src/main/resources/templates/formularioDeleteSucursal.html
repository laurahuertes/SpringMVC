<!DOCTYPE html>
<html>
<head>
    <title>Formulario para eliminar una Sucursal</title>
</head>
<body>
<h1>Eliminar Sucursal</h1>
<form action="/sucursales/deleteSucursal" method="POST">
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" required />
    <br/>
    <input type="submit" value="Eliminar Sucursal" />
</form>
</body>
</html>
